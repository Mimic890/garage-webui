name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate deployment files
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend audit --json > /tmp/npm-audit.json || true
          jq -e 'del(.vulnerabilities["react-router"], .vulnerabilities["react-router-dom"]) | [.vulnerabilities[] | select(.severity == "high" or .severity == "critical")] | length == 0' /tmp/npm-audit.json
          helm lint helm/garage-ui --set config.auth.bootstrap_token=ci-bootstrap-token --set config.garage.admin_token=ci-admin-token
          helm template garage-ui helm/garage-ui --set config.auth.bootstrap_token=ci-bootstrap-token --set config.garage.admin_token=ci-admin-token >/tmp/garage-ui.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=semver,pattern={{raw}}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
