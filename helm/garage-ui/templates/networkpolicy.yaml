{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "garage-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "garage-ui.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  {{- if has "Ingress" .Values.networkPolicy.policyTypes }}
  {{- if .Values.networkPolicy.ingress.from }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        {{- toYaml .Values.networkPolicy.ingress.ports | nindent 8 }}
  {{- else }}
  ingress: []
  {{- end }}
  {{- end }}
  {{- if has "Egress" .Values.networkPolicy.policyTypes }}
  {{- if .Values.networkPolicy.egress.to }}
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.egress.to | nindent 8 }}
      ports:
        {{- toYaml .Values.networkPolicy.egress.ports | nindent 8 }}
  {{- else }}
  egress: []
  {{- end }}
  {{- end }}
{{- end }}
