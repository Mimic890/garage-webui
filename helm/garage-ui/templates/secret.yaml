{{- if and .Values.config.auth.admin.enabled (not .Values.config.auth.admin.existingSecret.name) (not .Values.config.auth.admin.password) }}
{{- fail "config.auth.admin.password or config.auth.admin.existingSecret.name is required when admin authentication is enabled" }}
{{- end }}
{{- if and .Values.config.auth.admin.enabled .Values.config.auth.admin.password (lt (len .Values.config.auth.admin.password) 12) }}
{{- fail "config.auth.admin.password must be at least 12 characters" }}
{{- end }}
{{- if and (or .Values.config.garage.endpoint .Values.config.garage.admin_endpoint) (not .Values.config.garage.admin_token) (not .Values.config.garage.existingSecret.name) }}
{{- fail "config.garage.admin_token or config.garage.existingSecret.name is required when Garage endpoints are configured" }}
{{- end }}
{{- if and .Values.config.auth.admin.enabled (not .Values.config.auth.admin.username) }}
{{- fail "config.auth.admin.username is required when admin authentication is enabled" }}
{{- end }}
{{- if and .Values.config.auth.oidc.enabled (not .Values.config.auth.oidc.existingSecret.name) (not .Values.config.auth.oidc.client_secret) }}
{{- fail "config.auth.oidc.client_secret or config.auth.oidc.existingSecret.name is required when OIDC is enabled" }}
{{- end }}
{{- if and .Values.config.auth.jwt_private_key .Values.config.auth.jwt_private_key_secret.name }}
{{- fail "set only one of config.auth.jwt_private_key and config.auth.jwt_private_key_secret.name" }}
{{- end }}
{{- if and (not .Values.config.garage.existingSecret.name) .Values.config.garage.admin_token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garage-ui.fullname" . }}-admin-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ .Values.config.garage.admin_token | b64enc | quote }}
{{- end }}
---
{{- if and .Values.config.auth.bootstrap_token (not .Values.config.auth.bootstrapTokenSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garage-ui.fullname" . }}-bootstrap-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
type: Opaque
data:
  bootstrap-token: {{ .Values.config.auth.bootstrap_token | b64enc | quote }}
{{- end }}
---
{{- if and .Values.config.auth.admin.enabled (not .Values.config.auth.admin.existingSecret.name) .Values.config.auth.admin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garage-ui.fullname" . }}-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.config.auth.admin.password | b64enc | quote }}
{{- end }}
---
{{- if and .Values.config.auth.oidc.enabled (not .Values.config.auth.oidc.existingSecret.name) .Values.config.auth.oidc.client_secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garage-ui.fullname" . }}-oidc-client-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ .Values.config.auth.oidc.client_secret | b64enc | quote }}
{{- end }}
---
{{- if and (not .Values.config.auth.jwt_private_key_secret.name) .Values.config.auth.jwt_private_key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garage-ui.fullname" . }}-jwt-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  jwt-key.pem: {{ .Values.config.auth.jwt_private_key | b64enc | quote }}
{{- end }}
---
{{- if and (not .Values.config.auth.jwt_private_key_secret.name) (not .Values.config.auth.jwt_private_key) }}
{{- $secretName := printf "%s-jwt-key" (include "garage-ui.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if not $existingSecret }}
{{- $privateKey := genPrivateKey "ed25519" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  jwt-key.pem: {{ $privateKey | b64enc | quote }}
{{- end }}
{{- end }}
