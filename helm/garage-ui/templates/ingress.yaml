{{- if .Values.ingress.enabled -}}
{{- if and (not .Values.ingress.allowInsecure) (not .Values.ingress.tls) }}
{{- fail "ingress.tls is required when ingress is enabled; set ingress.allowInsecure=true only for intentional HTTP" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "garage-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- if and (eq $.Values.ingress.className "nginx") (not $.Values.ingress.allowInsecure) (not (hasKey . "nginx.ingress.kubernetes.io/force-ssl-redirect")) }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- end }}
  {{- end }}
  {{- if and (not .Values.ingress.annotations) (eq .Values.ingress.className "nginx") (not .Values.ingress.allowInsecure) }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "garage-ui.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
