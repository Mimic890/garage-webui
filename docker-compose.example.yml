services:
  garage-ui:
    image: ghcr.io/mimic890/garage-webui:latest
    container_name: garage-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Persisted admin account + cluster list (entrypoint chowns to uid 1000)
      - garage_ui_data:/app/data
    environment:
      # Minimal environment variables, just for server basics
      - GARAGE_UI_SERVER_HOST=0.0.0.0
      - GARAGE_UI_SERVER_PORT=8080
      - GARAGE_UI_DATA_DIR=/app/data
      - GARAGE_UI_LOGGING_LEVEL=info # Options: trace, debug, info, warn, error
      # - GARAGE_UI_LOGGING_FORMAT=text # Options: text, json
      # - GARAGE_UI_SERVER_PROTOCOL=http
      # - GARAGE_UI_SERVER_ROOT_URL=http://localhost:8080
      # - GARAGE_UI_SERVER_ALLOWED_IPS=127.0.0.1,192.168.1.0/24
      # - GARAGE_UI_SERVER_MAX_BODY_SIZE=314572800 # 300MB
      # - GARAGE_UI_SERVER_MAX_HEADER_SIZE=1048576 # 1MB
      # - GARAGE_UI_SERVER_READ_BUFFER_SIZE=4096 # 4KB
      # - GARAGE_UI_SERVER_WRITE_BUFFER_SIZE=4096 # 4KB

volumes:
  garage_ui_data:
