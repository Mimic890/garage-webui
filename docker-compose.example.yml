---
services:
  garage-ui:
    image: .
    container_name: garage-ui
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Garage S3 Configuration
      GARAGE_UI_GARAGE_ENDPOINT: "localhost:3900"
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: "http://localhost:3903"

      # Server Configuration
      GARAGE_UI_SERVER_HOST: "0.0.0.0"
      GARAGE_UI_SERVER_PORT: "8080"
      GARAGE_UI_SERVER_ENVIRONMENT: "production"
 